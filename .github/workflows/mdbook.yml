name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.deploy_gate.outputs.site_changed }}
    env:
      MDBOOK_VERSION: 0.4.52
      MDBOOK_MERMAID_VERSION: 0.15.0
      MDBOOK_KATEX_VERSION: 0.9.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect site-relevant changes (skip Pages deploy if none)
        id: site_changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Only gate deploy on push events; keep PR/dispatch behavior unchanged.
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # New branch creation / unknown base: allow deploy.
          if [[ "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure BEFORE commit exists (actions/checkout is shallow by default).
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --prune origin "${BEFORE}"; then
              echo "site_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git diff --name-only "${BEFORE}" "${AFTER}" | grep -Eq '^(docs/|scripts/|book\\.toml$|\\.github/workflows/mdbook\\.yml$)'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute papers cache key
        id: papers_cache_key
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_papers_pdfs.py cache-key --github-output

      - name: Cache papers PDFs
        id: cache_papers_pdfs
        uses: actions/cache@v4
        with:
          path: |
            docs/papers/**/main.pdf
            .ci_cache/papers/**/sources.sha256
          key: ${{ runner.os }}-papers-pdf-${{ steps.papers_cache_key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-papers-pdf-

      - name: Plan papers PDF build
        id: papers_plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_papers_pdfs.py plan --github-output
      
      - name: Decide whether to deploy Pages (docs change or new PDFs)
        id: deploy_gate
        shell: bash
        env:
          DIFF_CHANGED: ${{ steps.site_changes.outputs.site_changed }}
          PAPERS_TO_BUILD: ${{ steps.papers_plan.outputs.papers_to_build }}
        run: |
          set -euo pipefail

          if [[ "${DIFF_CHANGED}" == "true" ]]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the CI plans to (re)build any paper PDF, the published site should be refreshed
          # to include the newly generated artifacts (PDFs are not tracked by git).
          if [[ "${PAPERS_TO_BUILD}" != "0" ]]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache APT archives (TeX)
        if: steps.papers_plan.outputs.papers_to_build != '0'
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .ci_cache/apt/archives
          key: ${{ runner.os }}-apt-tex-${{ hashFiles('.github/workflows/mdbook.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-tex-

      - name: Install TeX Live (only if needed)
        if: steps.papers_plan.outputs.papers_to_build != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci_cache/apt/archives
          sudo mkdir -p /var/cache/apt/archives
          if compgen -G ".ci_cache/apt/archives/*.deb" > /dev/null; then
            sudo cp -f .ci_cache/apt/archives/*.deb /var/cache/apt/archives/ || true
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-bibtex-extra \
            texlive-science \
            texlive-xetex \
            texlive-luatex

          sudo cp -f /var/cache/apt/archives/*.deb .ci_cache/apt/archives/ || true
          sudo chown -R "$(id -u)":"$(id -g)" .ci_cache/apt || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build papers PDFs (only if needed)
        if: steps.papers_plan.outputs.papers_to_build != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_papers_pdfs.py build --clean

      - name: Verify all papers PDFs exist
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_papers_pdfs.py verify
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Cache mdBook binaries (Cargo)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-katex-${{ env.MDBOOK_KATEX_VERSION }}-mermaid-${{ env.MDBOOK_MERMAID_VERSION }}
          restore-keys: |
            ${{ runner.os }}-mdbook-${{ env.MDBOOK_VERSION }}-
            ${{ runner.os }}-mdbook-
            
      - name: Install mdBook
        run: |
          # Check if mdbook is already installed and has the correct version
          if ! command -v mdbook &> /dev/null || ! mdbook --version | grep -q "$MDBOOK_VERSION"; then
            cargo install --version ${MDBOOK_VERSION} mdbook
          fi
          # Check if mdbook-katex is already installed and has the correct version
          if ! command -v mdbook-katex &> /dev/null || ! mdbook-katex --version 2>&1 | grep -q "$MDBOOK_KATEX_VERSION"; then
            cargo install --version ${MDBOOK_KATEX_VERSION} mdbook-katex
          fi
          # Check if mdbook-mermaid is already installed and has the correct version
          if ! command -v mdbook-mermaid &> /dev/null || ! mdbook-mermaid --version 2>&1 | grep -q "$MDBOOK_MERMAID_VERSION"; then
            cargo install --version ${MDBOOK_MERMAID_VERSION} mdbook-mermaid
          fi
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy_gate.outputs.site_changed == 'true'
        id: pages
        uses: actions/configure-pages@v4
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy_gate.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.site_changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4